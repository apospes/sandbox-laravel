# =============================================================================
# Laravel Docker starter template
# All variables come from the project's .env (created by ./setup.sh).
# PROJECT_NAME prefixes every container, network and volume name, so copies of
# this template never collide with each other.
# =============================================================================
name: ${PROJECT_NAME:?PROJECT_NAME is not set - run ./setup.sh first}

services:
  # ---------------------------------------------------------------------------
  # app: PHP-FPM + Composer + Node.js + Xdebug (runs as a non-root user)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        NODE_MAJOR: ${NODE_MAJOR:-22}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: ${PROJECT_NAME}-app:php${PHP_VERSION:-8.3}
    container_name: ${PROJECT_NAME}-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - composer-cache:/home/app/.composer/cache
      - npm-cache:/home/app/.npm
    ports:
      # Vite dev server (npm run dev) so the browser can reach HMR.
      - "${BIND_ADDRESS:-127.0.0.1}:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment:
      TZ: ${TZ:-UTC}
      # Xdebug 3: XDEBUG_MODE=off disables it, "debug" enables step debugging.
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: "client_host=${XDEBUG_CLIENT_HOST:-host.docker.internal} client_port=${XDEBUG_PORT:-9003} idekey=${XDEBUG_IDEKEY:-PHPSTORM}"
      # Tells PhpStorm which "Server" (path mappings) to use. Must equal PROJECT_NAME.
      PHP_IDE_CONFIG: "serverName=${PROJECT_NAME}"
    extra_hosts:
      # Lets the container reach the IDE on the host (needed on Linux).
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # PHP-FPM is ready when something listens on port 9000.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # nginx: serves ./src/public and forwards PHP to the app container
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:stable-alpine
    container_name: ${PROJECT_NAME}-nginx
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # mysql: persistent database, reachable as "mysql" inside Docker
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: ${PROJECT_NAME}-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is not set - run ./setup.sh}
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is not set - run ./setup.sh}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is not set - run ./setup.sh}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - run ./setup.sh}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      # Uses TCP (127.0.0.1) so it only passes once the real server is up,
      # not during the temporary init server that listens on a socket only.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------------------
  # mailpit: catches outgoing mail (SMTP 1025, web UI 8025)
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-latest}
    container_name: ${PROJECT_NAME}-mailpit
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_WEB_PORT:-8025}:8025"
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - app-network
    healthcheck:
      # The mailpit image has no shell, so use the exec form.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    name: ${PROJECT_NAME}_network

volumes:
  mysql-data:
    name: ${PROJECT_NAME}_mysql-data
  composer-cache:
    name: ${PROJECT_NAME}_composer-cache
  npm-cache:
    name: ${PROJECT_NAME}_npm-cache
