; Xdebug 3 configuration.
;
; Everything below is a *default*. The compose file passes:
;   XDEBUG_MODE    (off|debug|debug,develop|coverage|profile ...)  -> overrides xdebug.mode
;   XDEBUG_CONFIG  (client_host / client_port / idekey)            -> overrides the settings below
; so you normally change values in .env, not here.
;
; Toggle debugging with:  make xdebug-on / make xdebug-off
; With mode=off Xdebug does almost no work, so there is no real overhead.

[xdebug]
xdebug.mode = off
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.discover_client_host = false
xdebug.log_level = 0
