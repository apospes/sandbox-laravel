; Development-oriented PHP settings, loaded after the image defaults
; (installed as conf.d/99-app.ini). Rebuild the image to apply: make build

[PHP]
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 64M
post_max_size = 64M
error_reporting = E_ALL
; Laravel renders its own error pages; PHP-level errors go to the container log.
display_errors = Off
log_errors = On
zend.assertions = 1
expose_php = Off
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Date]
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
; Dev: always check for changed files so edits show up immediately.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
