# Nginx vhost for Laravel. Document root is the Laravel public/ directory.
# PHP requests are forwarded to the "app" service (PHP-FPM) on port 9000.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # --- Security-conscious defaults ----------------------------------------
    server_tokens off;
    client_max_body_size 64M;
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # --- Docker DNS ----------------------------------------------------------
    # Resolve "app" at request time (not only at nginx start-up), so nginx keeps
    # working when the app container is recreated and gets a new IP address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_upstream app:9000;

    # Used by the container healthcheck (independent of Laravel being installed).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never expose dotfiles (.env, .git, .htaccess ...), except /.well-known.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Laravel URL rewriting.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static assets: served directly by nginx, short cache (development).
    # Unknown files fall through to Laravel (so dynamic routes still work).
    location ~* \.(?:css|js|map|jpe?g|png|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ {
        expires 1h;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # The only PHP entry point is index.php.
    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        # Long timeout so breakpoints in Xdebug sessions don't cause 504s.
        fastcgi_read_timeout 300s;
    }

    # Any other .php file is not executable.
    location ~ \.php$ {
        return 404;
    }
}
